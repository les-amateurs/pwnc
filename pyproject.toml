[tool.poetry]
name = "pwnc"
version = "0.1.0"
description = ""
authors = ["unvariant <unvariant.winter@gmail.com>"]
readme = "README.md"
packages = [
    { include = "pwnc" },
    { include = "payloads" },
]
include = [
    { path = "payloads/_vendor/angrop/LICENSE", format = ["sdist", "wheel"] },
    { path = "payloads/_vendor/angrop/UPSTREAM.md", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
pwnc = "pwnc.pwncli:main"

[tool.poetry.dependencies]
python = "^3.11"
pwntools = "^4.13.1"
pyelftools = "^0.31"
toml = "^0.10.2"
argcomplete = "^3.5.1"
colorama = "^0.4.6"
beautifulsoup4 = "^4.14.3"
aiohttp = "^3.13.3"
angr = [
    { version = "9.2.175", python = ">=3.11,<3.12", optional = true },
    { version = "9.2.196", python = ">=3.12", optional = true },
]
tqdm = { version = "^4.70.0", optional = true }
pydemumble = [
    { version = "0.1.1", python = ">=3.11,<3.12", optional = true },
    { version = "^0.1.3", python = ">=3.12", optional = true },
]
pycparser = { version = ">=2.22,<3", python = ">=3.11,<3.12", optional = true }

[tool.poetry.extras]
rop = ["angr", "tqdm", "pydemumble", "pycparser"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
line-ending = "lf"

[tool.ruff.lint]
ignore = ["F403", "F405"]
exclude = ["pwnc/gdb/*"]
fixable = ["F541"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
